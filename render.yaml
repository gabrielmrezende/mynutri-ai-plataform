# =============================================================================
# render.yaml — Infraestrutura como código para o Render
# Docs: https://render.com/docs/blueprint-spec
#
# Como usar:
#   1. Faça push deste arquivo para o seu repositório GitHub
#   2. No Render: New → Blueprint → conecte o repositório
#   O Render criará o Web Service, o Worker Celery e o Key Value (Redis).
#   O PostgreSQL é o Supabase — preencha DATABASE_URL no painel.
#
# Variáveis com "sync: false" devem ser preenchidas manualmente no painel
# (Environment > Add Environment Variable) — NUNCA commite segredos.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Web Service — API Django + frontend
  # ---------------------------------------------------------------------------
  - type: web
    name: mynutri-ai-api
    runtime: python
    region: ohio          # Ohio (us-east-1) — menor latência para Brasil
    plan: free            # troque por "starter" para produção real

    buildCommand: "./build.sh"
    # O build não alcança o banco interno; migrations rodam no start.
    # (preDeployCommand seria o ideal, mas não está disponível no plano free.)
    # 2 workers x 4 threads cabem nos 512 MB do free; timeout 120s cobre a
    # regeneração de refeição (chamada síncrona à IA) sem prender worker morto.
    startCommand: "python manage.py migrate --no-input && python manage.py createcachetable && gunicorn mynutri.wsgi:application --workers 2 --threads 4 --timeout 120 --log-file -"
    healthCheckPath: /health/

    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"

      - key: DEBUG
        value: "False"

      - key: SECRET_KEY
        generateValue: true   # Render gera um valor aleatório seguro automaticamente

      - key: DATABASE_URL
        sync: false           # Supabase → Connect → Session pooler (porta 5432)

      - key: ALLOWED_HOSTS
        sync: false           # seu domínio próprio (o *.onrender.com é incluído automaticamente)

      - key: CORS_ALLOWED_ORIGINS
        sync: false           # preencha com a URL do seu frontend

      - key: GOOGLE_CLIENT_ID
        sync: false           # OAuth client ID do Google (obrigatório)

      - key: AI_API_KEY
        sync: false           # sua chave da OpenAI/Gemini — NUNCA commite no git

      - key: AI_API_URL
        sync: false           # ex: https://api.openai.com/v1/chat/completions

      - key: AI_MODEL
        value: "gpt-4o-mini"

      - key: LOG_LEVEL
        value: "WARNING"

      - key: NUM_PROXIES
        value: "1"            # Render tem 1 proxy reverso na frente da app

      - key: SENTRY_DSN
        sync: false           # opcional

      # Cache compartilhado (throttle/rate limit) — obrigatório com DEBUG=False
      - key: CACHE_URL
        fromService:
          name: mynutri-redis
          type: keyvalue
          property: connectionString

      - key: CELERY_BROKER_URL
        fromService:
          name: mynutri-redis
          type: keyvalue
          property: connectionString

      - key: CELERY_RESULT_BACKEND
        fromService:
          name: mynutri-redis
          type: keyvalue
          property: connectionString

  # ---------------------------------------------------------------------------
  # Celery Worker — processa geração de dietas em background
  # Atenção: o Render NÃO oferece plano free para background workers.
  # ---------------------------------------------------------------------------
  - type: worker
    name: mynutri-celery-worker
    runtime: python
    region: ohio
    plan: starter

    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A mynutri worker --loglevel=info --concurrency=2 --without-heartbeat --without-gossip --without-mingle"

    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"

      - key: DEBUG
        value: "False"

      - key: SECRET_KEY
        fromService:
          name: mynutri-ai-api
          type: web
          envVarKey: SECRET_KEY

      - key: DATABASE_URL
        sync: false           # Supabase → Connect → Session pooler (porta 5432)

      - key: GOOGLE_CLIENT_ID
        sync: false

      - key: AI_API_KEY
        sync: false

      - key: AI_API_URL
        sync: false

      - key: AI_MODEL
        value: "gpt-4o-mini"

      - key: SENTRY_DSN
        sync: false

      - key: CACHE_URL
        fromService:
          name: mynutri-redis
          type: keyvalue
          property: connectionString

      - key: CELERY_BROKER_URL
        fromService:
          name: mynutri-redis
          type: keyvalue
          property: connectionString

      - key: CELERY_RESULT_BACKEND
        fromService:
          name: mynutri-redis
          type: keyvalue
          property: connectionString

  # ---------------------------------------------------------------------------
  # Key Value (Redis) — broker do Celery + cache da aplicação
  # Um único Redis serve aos dois: as chaves do cache usam KEY_PREFIX "mynutri".
  # noeviction: o broker não pode perder mensagens da fila; as chaves de cache
  # (throttle) sempre têm TTL, então não crescem indefinidamente.
  # ---------------------------------------------------------------------------
  - type: keyvalue
    name: mynutri-redis
    region: ohio
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []       # só acessível pela rede privada do Render

