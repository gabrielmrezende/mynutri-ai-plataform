name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"

jobs:
  test:
    name: Testes & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check .

      - name: Verificar configuração Django
        run: python manage.py check
        env:
          DJANGO_SETTINGS_MODULE: mynutri.test_settings

      - name: Verificar migrations pendentes
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: mynutri.test_settings

      - name: Checklist de produção (check --deploy)
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: mynutri.settings
          DEBUG: "False"
          SECRET_KEY: ci-only-fake-secret-key-0123456789-abcdefghijklmnopqrstuvwxyz-ABCDEF
          AI_API_KEY: ci-fake
          AI_API_URL: https://ai.example.com/v1/chat/completions
          GOOGLE_CLIENT_ID: ci-fake.apps.googleusercontent.com
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci   # só valida settings; check --deploy não conecta
          CACHE_URL: redis://localhost:6379/1
          ALLOWED_HOSTS: mynutri.example.com

      - name: Rodar testes com cobertura
        run: pytest --tb=short -q --cov --cov-report=term --cov-fail-under=85
        env:
          DJANGO_SETTINGS_MODULE: mynutri.test_settings

  e2e:
    name: Testes E2E (Playwright)
    runs-on: ubuntu-latest
    needs: test   # só roda se os testes unitários passarem

    env:
      DJANGO_SETTINGS_MODULE: mynutri.test_settings
      # SQLite em arquivo: migrate e runserver são processos diferentes
      TEST_DB_PATH: ${{ github.workspace }}/e2e-db.sqlite3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências Python
        run: pip install -r requirements-dev.txt

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar Playwright
        run: npm ci && npx playwright install --with-deps chromium

      - name: Iniciar servidor Django em background
        run: |
          python manage.py migrate --no-input
          nohup python manage.py runserver 127.0.0.1:8000 --noreload > django.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health/ > /dev/null; then
              echo "Servidor pronto após ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Servidor não respondeu em 30s"
          cat django.log
          exit 1

      - name: Rodar testes E2E
        run: npx playwright test --reporter=list
        env:
          CI: true

      - name: Log do servidor Django
        if: failure()
        run: cat django.log || true

      - name: Upload relatório Playwright
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  security:
    name: Verificação de segurança
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Instalar ferramentas de segurança
        run: pip install bandit pip-audit

      - name: Bandit — análise estática de segurança
        run: bandit -r . -x ./frontend,./staticfiles,./node_modules,./e2e,./load-tests -ll -q

      - name: pip-audit — dependências com vulnerabilidades conhecidas
        run: pip-audit -r requirements.txt --strict
