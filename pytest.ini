[pytest]
DJANGO_SETTINGS_MODULE = mynutri.test_settings
testpaths = nutrition user
norecursedirs = .git .claude node_modules mynutri-ai-plataform staticfiles frontend e2e load-tests playwright-report test-results venv .venv
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts =
    --tb=short
    -v
